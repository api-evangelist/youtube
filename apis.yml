- name: Use Cases
  type: UseCases
  data:
  - name: Video Publishing Platform
    description: Build automated video upload and management workflows for content
      creators and media companies.
  - name: Social Media Dashboard
    description: Aggregate YouTube analytics with other social platforms for unified
      performance monitoring.
  - name: Content Moderation
    description: Automate comment moderation and abuse reporting for community management
      at scale.
  - name: Live Event Management
    description: Schedule and manage live streaming events with real-time chat and
      audience interaction.
  - name: Education Platform
    description: Organize educational video content into playlists with searchable
      course catalogs.
  - name: Digital Rights Management
    description: Track and manage content ownership, claims, and monetization policies
      using Content ID.
  - name: Video Search Application
    description: Build custom video search experiences with filters for topics, dates,
      and regions.
  - name: Analytics Dashboard
    description: Create custom reporting dashboards with channel and video performance
      metrics.
  - name: Accessibility Tools
    description: Manage captions and translations to improve video accessibility across
      languages.
  - name: Embedded Video Experience
    description: Create branded video experiences with customized embedded players
      on external websites.
- name: Integrations
  type: Integrations
  data:
  - name: Google Cloud Platform
    description: Integrates with GCP for authentication, hosting, and infrastructure
      services.
  - name: Google Analytics
    description: Combine YouTube Analytics data with Google Analytics for comprehensive
      web and video metrics.
  - name: Google Ads
    description: Connect YouTube content with Google Ads for video advertising campaigns.
  - name: Firebase
    description: Use Firebase with YouTube APIs for mobile app development with video
      features.
  - name: Google Workspace
    description: Embed YouTube videos in Google Docs, Slides, and Sites for collaborative
      content.
